<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-deep: #0d1710;
    --bg-panel: #141f10;
    --bg-card: #1a2a15;
    --border: rgba(160, 210, 120, 0.18);
    --border-bright: rgba(160, 210, 120, 0.45);
    --accent-green: #7ec850;
    --accent-amber: #f59e0b;
    --accent-cyan: #22d3ee;
    --text-primary: #e8f5e2;
    --text-secondary: #8aad78;
    --text-muted: #4a6b3a;
  }
  body { font-family: 'Noto Sans KR', sans-serif; background: transparent; color: var(--text-primary); overflow: hidden; margin:0; padding:0; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 28px; background: var(--bg-panel); border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, #7ec850, #22d3ee); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .logo-text { font-size: 18px; font-weight: 700; }
  .logo-sub { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
  .header-badges { display: flex; gap: 8px; }
  .badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(126, 200, 80, 0.12); border: 1px solid rgba(126, 200, 80, 0.3); color: var(--accent-green); }
  .badge.cyan { background: rgba(34,211,238,0.12); border-color: rgba(34,211,238,0.3); color: var(--accent-cyan); }
  .edit-toggle { display: flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 8px; border: 1px solid var(--border-bright); background: transparent; color: var(--text-secondary); font-family: inherit; font-size: 13px; cursor: pointer; transition: all .2s; }
  .edit-toggle:hover, .edit-toggle.on { background: rgba(126,200,80,.15); color: var(--accent-green); border-color: var(--accent-green); }
  .map-area { position: relative; overflow: visible; height: 750px; background: radial-gradient(ellipse at 50% 50%, #182912 0%, #0d1710 70%); }
  #map-svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .district-path { cursor: default; transition: filter 0.2s, opacity 0.2s; stroke: rgba(180, 230, 140, 0.55); stroke-width: 1.5; stroke-linejoin: round; fill: rgba(30, 50, 20, 0.4); }
  .edit-mode .district-path { cursor: crosshair; }
  .district-path:hover { filter: brightness(1.25); }
  .district-path.selected { stroke: var(--accent-cyan) !important; stroke-width: 2.5 !important; filter: drop-shadow(0 0 8px rgba(34,211,238,0.6)); }
  .district-label { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; pointer-events: none; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9)); }
  #edit-popup { position: absolute; background: rgba(15, 25, 12, 0.96); backdrop-filter: blur(16px); border: 1px solid rgba(34, 211, 238, 0.4); border-radius: 12px; padding: 16px; width: 220px; box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 20px rgba(34,211,238,0.15); display: none; z-index: 100; }
  #edit-popup.visible { display: block; }
  .popup-title { font-size: 11px; font-weight: 700; color: var(--accent-cyan); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .popup-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; }
  .popup-close:hover { color: var(--text-primary); }
  .popup-field { margin-bottom: 10px; }
  .popup-field label { display: block; font-size: 10px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
  .popup-field input[type=text], .popup-field input[type=number] { width: 100%; padding: 6px 10px; background: rgba(255,255,255,.06); border: 1px solid var(--border-bright); border-radius: 6px; color: var(--text-primary); font-family: inherit; font-size: 12px; outline: none; transition: border-color .15s; }
  .popup-field input:focus { border-color: var(--accent-cyan); }
  .color-palette { display: flex; gap: 6px; flex-wrap: wrap; }
  .color-swatch { width: 22px; height: 22px; border-radius: 5px; cursor: pointer; border: 2px solid transparent; transition: transform .15s, border-color .15s; }
  .color-swatch:hover { transform: scale(1.2); }
  .color-swatch.selected-color { border-color: white; transform: scale(1.15); }
  .popup-apply { width: 100%; padding: 7px; margin-top: 6px; background: linear-gradient(135deg, #22d3ee22, #7ec85022); border: 1px solid var(--accent-cyan); border-radius: 7px; color: var(--accent-cyan); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .popup-apply:hover { background: rgba(34,211,238,0.15); }
  /* Tooltip - fixed position, always visible */
  #tt {
    position: fixed;
    display: none;
    padding: 12px 14px;
    background: rgba(10,20,10,0.97);
    border: 1px solid rgba(126,200,80,0.5);
    border-radius: 10px;
    pointer-events: none;
    color: #e8f5e2;
    box-shadow: 0 6px 24px rgba(0,0,0,0.6), 0 0 12px rgba(126,200,80,0.2);
    z-index: 99999;
    min-width: 170px;
    max-width: 220px;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    transform: translate(16px, -50%);
  }
  .tt-title { font-size: 15px; font-weight: 700; color: #7ec850; margin-bottom: 8px; border-bottom: 1px solid rgba(180,230,140,0.25); padding-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .tt-title::before { content: '📍'; font-size: 14px; }
  .tt-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: rgba(232,245,226,0.8); }
  .tt-val { font-weight: 700; color: #f59e0b; }
  
  #info-popup { position: absolute; background: rgba(15, 25, 12, 0.98); backdrop-filter: blur(16px); border: 1px solid rgba(126, 200, 80, 0.5); border-radius: 12px; padding: 20px; width: 280px; box-shadow: 0 8px 32px rgba(0,0,0,0.8), 0 0 25px rgba(126,200,80,0.2); display: none; z-index: 150; }
  #info-popup.visible { display: block; }
  .info-title { font-size: 16px; font-weight: 700; color: var(--accent-green); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(126, 200, 80, 0.3); padding-bottom: 8px; }
  .info-section { margin-bottom: 12px; }
  .info-section-title { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .info-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; padding: 4px 8px; background: rgba(255,255,255,0.03); border-radius: 4px; }
  .info-val { font-weight: 700; color: var(--accent-amber); }

</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">🌿</div>
    <div>
      <div class="logo-text">그냥드림 대시보드</div>
      <div class="logo-sub">은평구 이용자 분포 현황</div>
    </div>
  </div>
  <div class="header-badges">
    <span class="badge cyan">● 실시간 연동</span>
  </div>
  <div style="display: flex; align-items: center; gap: 15px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 11px; color: var(--text-secondary); font-weight: 500;">지도 선명도</span>
      <input type="range" id="bg-opacity" min="0" max="1" step="0.05" value="0.45" oninput="document.querySelector('#map-svg image').setAttribute('opacity', this.value)" style="width: 80px; accent-color: var(--accent-green);">
    </div>
    <button class="edit-toggle" id="editToggle" onclick="toggleEditMode()">✏️ 편집 모드</button>
  </div>
</header>
<main>

      <div class="popup-title"><span>구역 관리</span><button class="popup-close" onclick="closePopup()">✖</button></div>
      <div class="popup-field"><label>구역 명칭</label><input type="text" id="popup-name"></div>
      <div class="popup-field"><label>총 인원 수</label><input type="number" id="popup-count" readonly></div>
      <div class="popup-field"><label>테마 색상</label><div class="color-palette" id="color-palette"></div></div>
      <button class="popup-apply" onclick="applyEdit()">✓ 지도에 반영</button>
    <div id="info-popup">
      <div class="info-title"><span id="info-name">동네 이름</span><button class="popup-close" onclick="closeInfoPopup()">✖</button></div>
      <div class="info-section">
        <div class="info-section-title">총 이용자 수</div>
        <div class="info-row" style="font-size: 18px; justify-content: center; background: rgba(126,200,80,0.1); border: 1px solid rgba(126,200,80,0.3);"><span class="info-val" id="info-count" style="color: var(--accent-green);">0명</span></div>
      </div>
      <div class="info-section" id="info-breakdown-section" style="display:none;">
        <div class="info-section-title">방문 목적 구분</div>
        <div id="info-breakdown-list"></div>
      </div>
    </div>
  </div>
</main>
<script>
const COLORS = [
  {hex: '#1e3514'}, {hex: '#2a4a1c'}, {hex: '#4a6b3a'}, {hex: '#6a8d57'},
  {hex: '#7ec850'}, {hex: '#a0d278'}, {hex: '#c2e6a0'}, {hex: '#22d3ee'},
  {hex: '#f59e0b'}, {hex: '#ef4444'}, {hex: '#6366f1'}, {hex: '#ec4899'}
];
let editMode = false, popupDistrictId = null, selectedColor = '#1e3514';
let districts = {};

function hexRGBA(hex, a) {
  let r=0,g=0,b=0;
  if(hex.length==7){ r=parseInt(hex.substr(1,2),16); g=parseInt(hex.substr(3,2),16); b=parseInt(hex.substr(5,2),16); }
  return `rgba(${r},${g},${b},${a})`;
}

function refreshMap() {
  Object.values(districts).forEach(d => {
    const p = document.getElementById(d.id);
    const l = document.getElementById('label-' + d.id);
    if(p) {
      p.style.fill = d.count > 0 ? hexRGBA(d.color, 0.6) : 'rgba(30,60,18,0.25)';
      p.dataset.name = d.name;
      p.dataset.count = d.count;
    }
    if(l) l.textContent = d.name + (d.count>0 ? ` (${d.count})` : '');
  });
}

const tt = document.getElementById('tt');

// Smart tooltip positioning - always keep inside viewport
function showTooltip(e, name, count) {
  const ttW = 190, ttH = 80;
  const vw = window.innerWidth, vh = window.innerHeight;
  let x = e.clientX + 16;
  let y = e.clientY - ttH / 2;

  // Clamp to viewport
  if (x + ttW > vw - 10) x = e.clientX - ttW - 16;
  if (y < 8) y = 8;
  if (y + ttH > vh - 8) y = vh - ttH - 8;

  tt.style.left = x + 'px';
  tt.style.top = y + 'px';
  tt.style.transform = 'none';
  tt.innerHTML = `<div class="tt-title">${name}</div><div class="tt-row"><span>이용자 수</span><span class="tt-val">${count}명</span></div>`;
  tt.style.display = 'block';
}

document.querySelectorAll('.district-path').forEach(el => {
  el.addEventListener('click', e => {
    e.stopPropagation();
    const id = el.id;
    const d = districts[id] || {id, name: el.dataset.name, count: parseInt(el.dataset.count)||0, color: '#1e3514'};
    
    if (editMode) {
      document.querySelectorAll('.district-path').forEach(p => p.classList.remove('selected'));
      el.classList.add('selected');
      popupDistrictId = id;
      document.getElementById('popup-name').value = d.name;
      document.getElementById('popup-count').value = d.count;
      selectedColor = d.color;
      renderPalette();
      const svgRect = document.getElementById('map-svg').getBoundingClientRect();
      const popup = document.getElementById('edit-popup');
      let px = e.clientX - svgRect.left + 16;
      let py = e.clientY - svgRect.top - 20;
      if (px + 230 > svgRect.width) px = e.clientX - svgRect.left - 240;
      if (py + 270 > svgRect.height) py = svgRect.height - 275;
      popup.style.left = px + 'px'; popup.style.top = py + 'px';
      popup.classList.add('visible');
      tt.style.display = 'none';
      document.getElementById('info-popup').classList.remove('visible');
    } else {
      // Info Mode (normal click)
      const infoPopup = document.getElementById('info-popup');
      document.getElementById('info-name').textContent = d.name;
      document.getElementById('info-count').textContent = d.count + '명';
      
      const bdList = document.getElementById('info-breakdown-list');
      const bdSec = document.getElementById('info-breakdown-section');
      bdList.innerHTML = '';
      
      let breakdown = [];
      try { breakdown = JSON.parse(el.dataset.breakdown || '[]'); } catch(e){}
      
      if (breakdown && breakdown.length > 0) {
        breakdown.sort((a,b) => b.count - a.count).forEach(b => {
          bdList.innerHTML += `<div class="info-row"><span>${b.visit_type}</span><span class="info-val">${b.count}명</span></div>`;
        });
        bdSec.style.display = 'block';
      } else {
        bdSec.style.display = 'none';
      }
      
      const svgRect = document.getElementById('map-svg').getBoundingClientRect();
      let px = e.clientX - svgRect.left + 16;
      let py = e.clientY - svgRect.top - 20;
      if (px + 290 > svgRect.width) px = e.clientX - svgRect.left - 300;
      if (py + 200 > svgRect.height) py = svgRect.height - 220;
      infoPopup.style.left = px + 'px'; infoPopup.style.top = py + 'px';
      infoPopup.classList.add('visible');
      tt.style.display = 'none';
      closePopup(); // close edit popup
    }
  });

  el.addEventListener('mouseenter', e => {
    if(editMode) return;
    const name = el.dataset.name;
    const count = parseInt(el.dataset.count) || 0;
    showTooltip(e, name, count);
  });

  el.addEventListener('mousemove', e => {
    if(editMode) return;
    const name = el.dataset.name;
    const count = parseInt(el.dataset.count) || 0;
    showTooltip(e, name, count);
  });

  el.addEventListener('mouseleave', () => {
    tt.style.display = 'none';
  });
});

document.getElementById('mapArea').addEventListener('click', () => {
  closePopup();
  closeInfoPopup();
});

function closeInfoPopup() {
  document.getElementById('info-popup').classList.remove('visible');
}

function toggleEditMode() {
  editMode = !editMode;
  const btn = document.getElementById('editToggle');
  const svg = document.getElementById('map-svg');
  if (editMode) {
    btn.classList.add('on'); btn.textContent = '✏️ 편집 ON';
    svg.style.cursor = 'crosshair';
  } else {
    btn.classList.remove('on'); btn.textContent = '✏️ 편집 모드';
    svg.style.cursor = 'default';
    closePopup();
  }
}

function renderPalette() {
  const p = document.getElementById('color-palette');
  p.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (c.hex === selectedColor ? ' selected-color' : '');
    sw.style.background = c.hex;
    sw.onclick = () => { selectedColor = c.hex; renderPalette(); };
    p.appendChild(sw);
  });
}

function closePopup() {
  document.getElementById('edit-popup').classList.remove('visible');
  document.querySelectorAll('.district-path').forEach(p => p.classList.remove('selected'));
  popupDistrictId = null;
}

function applyEdit() {
  if (!popupDistrictId) return;
  let d = districts[popupDistrictId];
  if(!d) d = {id: popupDistrictId};
  d.name = document.getElementById('popup-name').value || d.name;
  d.count = parseInt(document.getElementById('popup-count').value) || 0;
  d.color = selectedColor;
  districts[popupDistrictId] = d;
  const updatedDongs = Object.values(districts).map(dist => ({
    id: dist.id.replace('d-', ''),
    name: dist.name,
    color: dist.color
  }));
  if (typeof Streamlit !== 'undefined') {
    Streamlit.setComponentValue({ action: 'update_dongs', dongs: updatedDongs });
  }
  refreshMap();
}

function sendMessageToStreamlitClient(type, data) {
  const outData = Object.assign({isStreamlitMessage: true, type: type}, data);
  window.parent.postMessage(outData, "*");
}
const Streamlit = {
  setComponentReady: function() { sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1}); },
  setFrameHeight: function(height) { sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: height}); },
  setComponentValue: function(value) { sendMessageToStreamlitClient("streamlit:setComponentValue", {value: value}); }
};
window.addEventListener("message", function(event) {
  if (event.data.type === "streamlit:render") {
    const args = event.data.args;
    if (args.districts_data) {
      args.districts_data.forEach(d => { districts[d.id] = d; });
      refreshMap();
    }
    Streamlit.setFrameHeight(document.documentElement.scrollHeight);
  }
});
Streamlit.setComponentReady();
</script>
</body>
</html>
